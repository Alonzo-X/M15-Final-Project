<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Person Form</title>
</head>
<body>

<h2>Enter Information</h2>

<form id="personForm">
    First Name: <input type="text" id="firstName" required><br><br>
    Last Name: <input type="text" id="lastName" required><br><br>
    Course: <input type="text" id="course" required><br><br>
    Section: <input type="text" id="section" required><br><br>
    Role: <input type="text" id="role" required><br><br>

    <button type="submit">Submit</button>
</form>

<script src="script.js"></script>
</body>
</html>
