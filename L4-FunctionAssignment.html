<!DOCTYPE html>
<html>
<head>
  <title>Functions Assignment</title>
</head>
<body>
  <input id="nameInput" type="text" placeholder="Enter Name">
  <input id="ageInput" type="number" placeholder="Enter Age">
  <input id="myButton" type="button" value="Generate Song">
  <p id="output"></p>

  <script>

    // Outputs: "Happy Birthday to you!"
  function happyBirthday() {
    document.getElementById("output").innerHTML +=
      "Happy Birthday to you!<br>";
  }

  // Outputs: "Happy Birthday dear [name],"
  function birthdayName(name) {
    document.getElementById("output").innerHTML +=
      "Happy Birthday dear " + name + ",<br>";
  }

  // Builds the personalized birthday song
  function personalizedSong(age, name) {

    // Output age message and skip a line
    document.getElementById("output").innerHTML +=
      "You're " + age + " years old today!<br><br>";

    // Song sequence
    happyBirthday();
    happyBirthday();
    birthdayName(name);
    happyBirthday();
  }

  // Button event listener with anonymous function
  document.getElementById("myButton").addEventListener("click", function () {

    // Clear previous output
    document.getElementById("output").innerHTML = "";

    // Get input values
    let name = document.getElementById("nameInput").value;
    let age = document.getElementById("ageInput").value;

    // Generate song
    personalizedSong(age, name);
  });
	
  </script>
  </body>
</html>
